# CD (Jenkins): Postgres + Vault + API. Секреты для API читаются из Vault (USE_VAULT=true).
# Запуск: переменные в окружении агента + docker compose -f docker-compose.jenkins.yml -p <project> up -d
#
# Обязательно в env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET_KEY,
# API_USERNAME, API_PASSWORD, MLE_DOCKER_IMAGE, HOST_PORT.
# Опционально: VAULT_DEV_ROOT_TOKEN_ID (по умолчанию lab_dev_root), VAULT_KV_PATH (по умолчанию ml-lab).

services:
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  vault-init:
    build:
      context: .
      dockerfile: docker/vault-init/Dockerfile
    image: mle-template-vault-init:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_KV_PATH: ${VAULT_KV_PATH:-ml-lab}
      POSTGRES_USER: ${POSTGRES_USER:?Задай POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Задай POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Задай JWT_SECRET_KEY}
      API_USERNAME: ${API_USERNAME:?Задай API_USERNAME}
      API_PASSWORD: ${API_PASSWORD:?Задай API_PASSWORD}
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Задай POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Задай POSTGRES_DB}
    volumes:
      - jenkins_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${MLE_DOCKER_IMAGE:?Задай MLE_DOCKER_IMAGE}
    ports:
      - "${HOST_PORT:?Задай HOST_PORT}:8000"
    environment:
      USE_VAULT: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_KV_MOUNT: secret
      VAULT_KV_PATH: ${VAULT_KV_PATH:-ml-lab}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  jenkins_pgdata:
