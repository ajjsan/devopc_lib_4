services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: twitter-sentiment-zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: twitter-sentiment-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 45s

  vault:
    image: hashicorp/vault:1.15
    container_name: twitter-sentiment-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  vault-init:
    build:
      context: .
      dockerfile: docker/vault-init/Dockerfile
    image: mle-template-vault-init:latest
    container_name: twitter-sentiment-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_KV_PATH: ${VAULT_KV_PATH:-ml-lab}
      POSTGRES_USER: ${POSTGRES_USER:?Задай POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?Задай POSTGRES_DB в .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Задай JWT_SECRET_KEY в .env}
      API_USERNAME: ${API_USERNAME:?Задай API_USERNAME в .env}
      API_PASSWORD: ${API_PASSWORD:?Задай API_PASSWORD в .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sentiment-predictions}
    restart: "no"

  db:
    image: postgres:16-alpine
    container_name: twitter-sentiment-pg
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Задай POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?Задай POSTGRES_DB в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: devops_hw_3:latest
    container_name: twitter-sentiment-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_VAULT: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_KV_MOUNT: secret
      VAULT_KV_PATH: ${VAULT_KV_PATH:-ml-lab}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  kafka-consumer:
    build: .
    image: devops_hw_3:latest
    container_name: twitter-sentiment-kafka-consumer
    env_file:
      - .env
    environment:
      USE_VAULT: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-lab_dev_root}
      VAULT_KV_MOUNT: secret
      VAULT_KV_PATH: ${VAULT_KV_PATH:-ml-lab}
    depends_on:
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    command: ["python", "-m", "src.kafka_consumer"]
    restart: unless-stopped

volumes:
  pgdata:
